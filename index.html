<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vennechat</title>
  <style>
    body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f2f2f2; }
    #meldingar { flex: 1; overflow-y: auto; padding: 12px; }
    .melding { background: white; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 80%; word-wrap: break-word; }
    .melding b { color: #2a6fdb; }
    form { display: flex; gap: 6px; padding: 10px; background: white; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; min-width: 0; }
    button { padding: 10px 16px; font-size: 16px; border: none; background: #2a6fdb; color: white; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="meldingar"></div>
  <form id="skjema">
    <input id="namn" placeholder="Namnet ditt" style="max-width:110px">
    <input id="tekst" placeholder="Skriv ei melding...">
    <button>Send</button>
  </form>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyARsf-j23g7ufNCzq8qh7cg1xRoeIQeGFk",
      authDomain: "testchat-57a03.firebaseapp.com",
      databaseURL: "https://testchat-57a03-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "testchat-57a03",
      storageBucket: "testchat-57a03.firebasestorage.app",
      messagingSenderId: "652063130215",
      appId: "1:652063130215:web:5fb98a593a66af3ebc0ac2"
    };

    firebase.initializeApp(firebaseConfig);
    const meldingar = firebase.database().ref('meldingar');

    const liste = document.getElementById('meldingar');
    const skjema = document.getElementById('skjema');

    function visMelding(namn, tekst) {
      const div = document.createElement('div');
      div.className = 'melding';
      div.innerHTML = '<b></b> <span></span>';
      div.querySelector('b').textContent = namn;
      div.querySelector('span').textContent = tekst;
      liste.appendChild(div);
      liste.scrollTop = liste.scrollHeight;
    }

    meldingar.on('child_added', (snap) => {
      const m = snap.val();
      visMelding(m.namn, m.tekst);
    });

    skjema.addEventListener('submit', (e) => {
      e.preventDefault();
      const namn = document.getElementById('namn').value.trim() || 'Anonym';
      const tekst = document.getElementById('tekst').value.trim();
      if (!tekst) return;
      meldingar.push({ namn, tekst, tid: Date.now() });
      document.getElementById('tekst').value = '';
    });
  </script>
</body>
</html>
